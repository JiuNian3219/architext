<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{FEATURE_NAME} — UI 預覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* [AI]: 基於 design_tokens.json 替換為專案實際顏色 */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "hsl(0 0% 100%)",
              foreground: "hsl(222.2 84% 4.9%)",
              card: "hsl(210 40% 98%)",
              primary: "hsl(221.2 83.2% 53.3%)",
              "primary-foreground": "hsl(210 40% 98%)",
              muted: "hsl(210 40% 96.1%)",
              "muted-foreground": "hsl(215.4 16.3% 46.9%)",
              destructive: "hsl(0 84.2% 60.2%)",
              "destructive-foreground": "hsl(210 40% 98%)",
              border: "hsl(214.3 31.8% 91.4%)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background text-foreground min-h-screen antialiased">
    <!-- DEFAULT: [AI] 基於 ui.md 元件樹填充 -->
    <div
      id="s-default"
      class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8"
    >
      <header class="flex items-center justify-between mb-6">
        <h1 class="text-4xl font-bold">{FEATURE_NAME}</h1>
        <button
          class="bg-primary text-primary-foreground rounded-md px-4 py-2 text-sm font-medium shadow-sm"
        >
          主操作
        </button>
      </header>
      <main class="space-y-4">
        <!-- [AI]: 替換為實際內容元件 -->
        <div class="bg-card rounded-lg shadow-sm border border-border p-6">
          <p class="text-muted-foreground text-sm">內容區域佔位</p>
        </div>
      </main>
    </div>

    <!-- LOADING: [AI] 骨架屏，匹配 Default 佈局結構 -->
    <div
      id="s-loading"
      class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden"
    >
      <div class="flex items-center justify-between mb-6">
        <div class="animate-pulse rounded-md bg-muted h-9 w-48"></div>
        <div class="animate-pulse rounded-md bg-muted h-9 w-24"></div>
      </div>
      <div class="space-y-4">
        <div class="bg-card rounded-lg border border-border p-6 space-y-3">
          <div class="animate-pulse rounded-md bg-muted h-5 w-1/3"></div>
          <div class="animate-pulse rounded-md bg-muted h-4 w-full"></div>
        </div>
      </div>
    </div>

    <!-- EMPTY: [AI] 空狀態 -->
    <div
      id="s-empty"
      class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden"
    >
      <div
        class="flex flex-col items-center justify-center py-20 text-muted-foreground gap-3"
      >
        <p class="text-lg font-medium">暫無資料</p>
        <p class="text-sm">目前沒有可顯示的內容</p>
      </div>
    </div>

    <!-- ERROR: [AI] 錯誤狀態 -->
    <div
      id="s-error"
      class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden"
    >
      <div class="flex flex-col items-center justify-center py-20 gap-4">
        <p class="text-lg font-medium">載入失敗</p>
        <p class="text-sm text-muted-foreground">請檢查網路連線後重試</p>
        <button
          class="bg-primary text-primary-foreground rounded-md px-4 py-2 text-sm font-medium shadow-sm"
        >
          重試
        </button>
      </div>
    </div>

    <!-- 狀態切換器（僅預覽用） -->
    <div
      class="fixed bottom-4 right-4 bg-card border border-border rounded-lg shadow-md p-2 flex gap-1 z-50"
    >
      <button
        onclick="sw('default')"
        class="px-2 py-1 text-xs rounded bg-primary text-primary-foreground"
      >
        預設
      </button>
      <button
        onclick="sw('loading')"
        class="px-2 py-1 text-xs rounded border border-border hover:bg-muted"
      >
        載入
      </button>
      <button
        onclick="sw('empty')"
        class="px-2 py-1 text-xs rounded border border-border hover:bg-muted"
      >
        空
      </button>
      <button
        onclick="sw('error')"
        class="px-2 py-1 text-xs rounded border border-border hover:bg-muted"
      >
        錯誤
      </button>
    </div>
    <script>
      function sw(s) {
        document
          .querySelectorAll("[id^=s-]")
          .forEach((e) => e.classList.add("hidden"));
        document.getElementById("s-" + s)?.classList.remove("hidden");
      }
    </script>
  </body>
</html>
