  <circle cx="27" cy="5"  r="1.2" fill="#b88a3f" opacity="0.5"/>
  <circle cx="5"  cy="27" r="1.2" fill="#b88a3f" opacity="0.5"/>
  <circle cx="27" cy="27" r="1.2" fill="#b88a3f" opacity="0.5"/>

