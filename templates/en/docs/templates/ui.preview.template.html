<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{FEATURE_NAME} — UI Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* [AI]: Replace with actual project colors from design_tokens.json */
    tailwind.config = { theme: { extend: { colors: {
      background:'hsl(0 0% 100%)', foreground:'hsl(222.2 84% 4.9%)',
      card:'hsl(210 40% 98%)', primary:'hsl(221.2 83.2% 53.3%)',
      'primary-foreground':'hsl(210 40% 98%)', muted:'hsl(210 40% 96.1%)',
      'muted-foreground':'hsl(215.4 16.3% 46.9%)', destructive:'hsl(0 84.2% 60.2%)',
      'destructive-foreground':'hsl(210 40% 98%)', border:'hsl(214.3 31.8% 91.4%)',
    }}}}
  </script>
</head>
<body class="bg-background text-foreground min-h-screen antialiased">

  <!-- DEFAULT: [AI] Populate based on ui.md component tree -->
  <div id="s-default" class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-4xl font-bold">{FEATURE_NAME}</h1>
      <button class="bg-primary text-primary-foreground rounded-md px-4 py-2 text-sm font-medium shadow-sm">Primary Action</button>
    </header>
    <main class="space-y-4">
      <!-- [AI]: Replace with actual content components -->
      <div class="bg-card rounded-lg shadow-sm border border-border p-6">
        <p class="text-muted-foreground text-sm">Content area placeholder</p>
      </div>
    </main>
  </div>

  <!-- LOADING: [AI] Skeleton matching Default layout -->
  <div id="s-loading" class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden">
    <div class="flex items-center justify-between mb-6">
      <div class="animate-pulse rounded-md bg-muted h-9 w-48"></div>
      <div class="animate-pulse rounded-md bg-muted h-9 w-24"></div>
    </div>
    <div class="space-y-4">
      <div class="bg-card rounded-lg border border-border p-6 space-y-3">
        <div class="animate-pulse rounded-md bg-muted h-5 w-1/3"></div>
        <div class="animate-pulse rounded-md bg-muted h-4 w-full"></div>
      </div>
    </div>
  </div>

  <!-- EMPTY: [AI] Empty state -->
  <div id="s-empty" class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden">
    <div class="flex flex-col items-center justify-center py-20 text-muted-foreground gap-3">
      <p class="text-lg font-medium">No Data</p>
      <p class="text-sm">Nothing to display at the moment</p>
    </div>
  </div>

  <!-- ERROR: [AI] Error state -->
  <div id="s-error" class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden">
    <div class="flex flex-col items-center justify-center py-20 gap-4">
      <p class="text-lg font-medium">Failed to Load</p>
      <p class="text-sm text-muted-foreground">Please check your connection and try again</p>
      <button class="bg-primary text-primary-foreground rounded-md px-4 py-2 text-sm font-medium shadow-sm">Retry</button>
    </div>
  </div>

  <!-- State Switcher (preview only) -->
  <div class="fixed bottom-4 right-4 bg-card border border-border rounded-lg shadow-md p-2 flex gap-1 z-50">
    <button onclick="sw('default')" class="px-2 py-1 text-xs rounded bg-primary text-primary-foreground">Default</button>
    <button onclick="sw('loading')" class="px-2 py-1 text-xs rounded border border-border hover:bg-muted">Loading</button>
    <button onclick="sw('empty')" class="px-2 py-1 text-xs rounded border border-border hover:bg-muted">Empty</button>
    <button onclick="sw('error')" class="px-2 py-1 text-xs rounded border border-border hover:bg-muted">Error</button>
  </div>
  <script>function sw(s){document.querySelectorAll('[id^=s-]').forEach(e=>e.classList.add('hidden'));document.getElementById('s-'+s)?.classList.remove('hidden')}</script>
</body>
</html>
